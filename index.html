<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>緊急地震速報モニター</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  /* ---------- standby dashboard ---------- */
  #standby { position: fixed; inset: 0; display: flex; color: #1d2733; background: #eef1f5; transition: transform 3s; }
  #sleft { width: 37vw; padding: 2.6vw 2vw 2vw 3vw; box-sizing: border-box; display: flex; flex-direction: column; gap: 1.3vw; }
  #sright { flex: 1; position: relative; background: #dce8f3; border-left: 1px solid #d3dce6; }
  #clockrow { display: flex; align-items: baseline; gap: 1.2vw; }
  #clock { font-size: 6.2vw; font-weight: 200; letter-spacing: .03em; color: #16202b; line-height: 1; font-variant-numeric: tabular-nums; }
  #date { font-size: 1.5vw; color: #5d6876; }
  #sline { font-size: 1.15vw; color: #5d6876; }
  .dot { display: inline-block; width: .8vw; height: .8vw; border-radius: 50%; background: #555; margin-right: .6vw; vertical-align: middle; }
  .dot.ok { background: #43a047; box-shadow: 0 0 .6vw #43a04788; } .dot.down { background: #e53935; }
  .card { background: #fff; border: 1px solid #dde3ea; box-shadow: 0 .15vw .5vw rgba(30,50,80,.06); border-radius: .9vw; padding: 1.1vw 1.3vw; }
  .ctitle { font-size: 1vw; color: #6b7684; font-weight: 700; letter-spacing: .12em; margin-bottom: .6vw; }
  #latest { display: flex; gap: 1.2vw; align-items: center; }
  .badge { box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); display: inline-flex; align-items: center; justify-content: center; border-radius: .5vw; font-weight: 900; }
  #lbadge { width: 6.4vw; height: 6.4vw; font-size: 3.4vw; border-radius: .8vw; flex: none; }
  #lplace { font-size: 2vw; font-weight: 800; color: #16202b; line-height: 1.2; }
  #lmeta { font-size: 1.15vw; color: #4f5a67; margin-top: .3vw; }
  #linfo { font-size: 1vw; color: #2e7d32; margin-top: .3vw; }
  #stats { display: flex; gap: .8vw; }
  #stats .card { flex: 1; padding: .8vw 1vw; }
  .snum { font-size: 2.4vw; font-weight: 700; color: #16202b; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .snum small { font-size: 1vw; color: #6b7684; font-weight: 400; margin-left: .2vw; }
  #list { flex: 1; overflow: hidden; }
  .eq { display: grid; grid-template-columns: 8.4vw 2.4vw 1fr 3.6vw; gap: .7vw; align-items: center; font-size: 1.1vw; padding: .36vw 0; border-top: 1px solid #edf0f4; }
  .eq:first-of-type { border-top: 0; }
  .eq .t { color: #5d6876; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .eq .badge { height: 1.7vw; font-size: 1vw; border-radius: .3vw; }
  .eq .pl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1d2733; font-weight: 600; }
  .eq .m { text-align: right; color: #4f5a67; font-variant-numeric: tabular-nums; }
  #hist { font-size: .85vw; line-height: 1.5; color: #8a94a1; white-space: pre; overflow: hidden; max-height: 4.2vw; }
  #smap, #inset { position: absolute; }
  #smap { inset: 0; width: 100%; height: 100%; }
  #inset { left: 1.6vw; top: 3.6vw; width: 14vw; height: 14vw; border: 1px solid #b9c6d3; border-radius: .6vw; background: #d3e2ef; }
  #insetlbl { position: absolute; left: 1.7vw; top: 2.2vw; font-size: .95vw; font-weight: 700; color: #5d6876; }
  #maptitle { position: absolute; right: 2vw; top: 2.2vw; text-align: right; font-size: 1.2vw; color: #5d6876; }
  #maptitle b { display: block; font-size: 1.6vw; color: #1d2733; font-weight: 700; }
  #slegend { position: absolute; right: 2vw; bottom: 1.6vw; display: flex; gap: .25vw; align-items: center; font-size: .9vw; color: #4f5a67; font-weight: 700; }
  #slegend .badge { width: 2vw; height: 1.4vw; font-size: .8vw; border-radius: .2vw; }
  /* ---------- weather panel (rotates with the quake map) ---------- */
  #wx { position: absolute; inset: 0; padding: 2.6vw 3vw; box-sizing: border-box; display: flex; flex-direction: column; gap: 1.6vw;
    background: linear-gradient(160deg, #e3f0fb 0%, #f6f9fc 70%); opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  #sright.showwx #wx { opacity: 1; }
  #smap, #inset, #insetlbl, #maptitle, #slegend { transition: opacity 1.2s; }
  #sright.showwx #smap, #sright.showwx #inset, #sright.showwx #insetlbl, #sright.showwx #maptitle, #sright.showwx #slegend { opacity: 0; }
  #wxhead { display: flex; justify-content: space-between; align-items: baseline; }
  #wxhead b { font-size: 1.6vw; color: #1d2733; } #wxhead span { font-size: 1vw; color: #6b7684; }
  #wxnow { display: flex; align-items: center; gap: 2vw; }
  #wxicon svg { width: 11vw; height: 11vw; display: block; }
  #wxtemp { font-size: 8vw; font-weight: 200; color: #16202b; line-height: 1; font-variant-numeric: tabular-nums; }
  #wxtemp small { font-size: 3vw; color: #5d6876; }
  #wxdesc { font-size: 2.2vw; font-weight: 800; color: #1d2733; }
  #wxsub { font-size: 1.2vw; color: #4f5a67; margin-top: .5vw; line-height: 1.6; }
  #wxsub .hi { color: #e53935; font-weight: 800; } #wxsub .lo { color: #1e88e5; font-weight: 800; }
  .wxrow { display: grid; gap: .6vw; }
  #wxhours { grid-template-columns: repeat(8, 1fr); }
  #wxdays { grid-template-columns: repeat(7, 1fr); }
  .wxc { background: #fff; border: 1px solid #dde3ea; border-radius: .8vw; padding: .7vw .3vw; text-align: center; font-size: 1.05vw; color: #4f5a67; }
  .wxc svg { width: 3.6vw; height: 3.6vw; display: block; margin: .3vw auto; }
  .wxc .tt { font-size: 1.5vw; font-weight: 700; color: #16202b; }
  .wxc .pp { color: #1e88e5; font-weight: 700; }
  .wxc.sun .d { color: #e53935; } .wxc.sat .d { color: #1e88e5; }
  .wxlbl { font-size: 1vw; color: #6b7684; font-weight: 700; letter-spacing: .12em; margin-bottom: -.8vw; }
  /* ---------- alert ---------- */
  #alert { position: fixed; inset: 0; display: none; }
  body.on #alert { display: block; } body.on #standby { display: none; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; background: #0a1a2e; }
  #ovl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; will-change: transform; }
  #bar { position: absolute; left: 0; right: 0; top: 0; padding: 1.2vw 2vw; display: flex; align-items: baseline;
    justify-content: space-between; font-weight: 900; box-shadow: 0 .4vw 1vw rgba(0,0,0,.5); }
  .yoho #bar { background: #f9a825; color: #111; }
  .keiho #bar { background: #c62828; color: #fff; }
  .cancel #bar { background: #455a64; color: #fff; }
  #title { font-size: 3.6vw; letter-spacing: .04em; }
  #serial { font-size: 2.2vw; }
  #panel { position: absolute; left: 1.6vw; top: 8.6vw; width: 31vw; padding: 1.4vw 1.6vw; box-sizing: border-box;
    background: rgba(0,0,0,.72); border-radius: 1vw; }
  #tags { font-size: 1.6vw; font-weight: 800; min-height: 2vw; margin-bottom: .6vw; }
  #tags span { background: #fff; color: #111; padding: .1vw .7vw; border-radius: .4vw; margin-right: .6vw; }
  #hypo { font-size: 3.6vw; font-weight: 900; line-height: 1.15; }
  #mag { font-size: 2.3vw; font-weight: 800; margin: .5vw 0 1vw; }
  #introw { display: flex; align-items: center; gap: 1.2vw; }
  #intlabel { font-size: 1.8vw; font-weight: 800; line-height: 1.3; }
  #int { font-size: 9vw; font-weight: 900; line-height: 1; padding: .6vw 1.4vw; border-radius: 1vw; background: #fff; color: #111; min-width: 10vw; text-align: center; }
  #areas { font-size: 1.6vw; font-weight: 700; margin-top: 1vw; max-height: 16vh; overflow: hidden; line-height: 1.4; }
  #times { font-size: 1.5vw; font-weight: 700; margin-top: 1vw; opacity: .85; }
  #legend { position: absolute; right: 1.6vw; bottom: 1.4vw; background: rgba(0,0,0,.7); border-radius: .8vw;
    padding: .8vw 1vw; font-size: 1.2vw; font-weight: 700; }
  #legend .row { display: flex; gap: .3vw; margin-top: .4vw; }
  #legend .sw { width: 2.4vw; height: 1.8vw; display: flex; align-items: center; justify-content: center; font-size: 1vw; border-radius: .2vw; }
  #wavekey { margin-top: .5vw; }
  #wavekey i { display: inline-block; width: 1.8vw; height: 0; border-top: .3vw solid; vertical-align: middle; margin: 0 .4vw 0 .8vw; }
  .flash #bar { animation: flash .5s steps(1) 6; }
  @keyframes flash { 50% { background: #fff; color: #111; } }
</style>
</head>
<body>
<div id="standby">
  <div id="sleft">
    <div>
      <div id="clockrow"><div id="clock">--:--</div><div id="date"></div></div>
      <div id="sline"><span id="dot" class="dot"></span><span id="stext">接続中…</span></div>
    </div>
    <div class="card"><div class="ctitle">最新の地震</div>
      <div id="latest"><div id="lbadge" class="badge" style="background:#e6ebf0">-</div>
        <div><div id="lplace">読み込み中…</div><div id="lmeta"></div><div id="linfo"></div></div></div>
    </div>
    <div id="stats">
      <div class="card"><div class="ctitle">24時間</div><div class="snum" id="s24">-<small>回</small></div></div>
      <div class="card"><div class="ctitle">7日間</div><div class="snum" id="s7">-<small>回</small></div></div>
      <div class="card"><div class="ctitle">7日間の最大</div><div class="snum" id="smax">-</div></div>
    </div>
    <div class="card" id="list"><div class="ctitle">最近の地震（震度1以上）</div><div id="eqrows"></div></div>
    <div id="hist"></div>
  </div>
  <div id="sright">
    <svg id="smap" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs><g id="land"><path id="landpath" fill="#fbfcfd" stroke="#c9d2dc"/><path id="landpref" fill="none" stroke="#97a5b4"/></g></defs>
      <use href="#land"/><g id="dots"></g>
    </svg>
    <div id="insetlbl">南西諸島</div>
    <svg id="inset" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><use href="#land"/><g id="dots2"></g></svg>
    <div id="maptitle"><b>震源マップ</b><span id="mapsub"></span></div>
    <div id="slegend"></div>
    <div id="wx">
      <div id="wxhead"><b id="wxplace">東京の天気</b><span id="wxupd"></span></div>
      <div id="wxnow"><div id="wxicon"></div><div id="wxtemp">--<small>℃</small></div>
        <div><div id="wxdesc">読み込み中…</div><div id="wxsub"></div></div></div>
      <div class="wxlbl">これから</div><div class="wxrow" id="wxhours"></div>
      <div class="wxlbl">週間</div><div class="wxrow" id="wxdays"></div>
    </div>
  </div>
</div>
<div id="alert">
  <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <g id="regions" stroke="#1d2633" stroke-linejoin="round"></g>
    <path id="prefborder" fill="none" stroke="#e6ebf0" stroke-opacity=".7" stroke-linejoin="round"/>
    <g id="official" fill="none" stroke="#fff" stroke-linejoin="round"></g>
  </svg>
  <!-- moving parts on their own layer so the map is not re-rasterised while waves spread -->
  <svg id="ovl" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <circle id="pwave" fill="none" stroke="#4fc3ff" r="0"/>
    <circle id="swave" fill="none" stroke="#ff5252" r="0"/>
    <g id="epi"></g>
  </svg>
  <div id="bar"><div id="title">緊急地震速報</div><div id="serial"></div></div>
  <div id="panel">
    <div id="tags"></div>
    <div id="hypo">-</div>
    <div id="mag"></div>
    <div id="introw"><div id="intlabel">予想<br>最大震度</div><div id="int">-</div></div>
    <div id="areas"></div>
    <div id="times"></div>
  </div>
  <div id="legend">
    <div>地域ごとの予想震度</div>
    <div style="font-size:1vw;opacity:.85">白枠＝気象庁が発表した地域／他は推計</div>
    <div class="row" id="lrow"></div>
    <div id="wavekey"><i style="border-color:#4fc3ff"></i>P波<i style="border-color:#ff5252"></i>S波</div>
  </div>
</div>

<script src="japan_map.js"></script>
<script src="voice/hypo.js"></script>
<script>
const $ = id => document.getElementById(id);
const CLASSES = [ // [label, lower bound of instrumental intensity, bg, fg]
  ['1',0.5,'#f2f2ff','#111'],['2',1.5,'#00aaff','#111'],['3',2.5,'#0041ff','#fff'],['4',3.5,'#fae696','#111'],
  ['5弱',4.5,'#ffe600','#111'],['5強',5.0,'#ff9900','#111'],['6弱',5.5,'#ff2800','#fff'],['6強',6.0,'#a50021','#fff'],['7',6.5,'#b40068','#fff']];
const COLOR = Object.fromEntries(CLASSES.map(c => [c[0], c]));
const SVGNS = 'http://www.w3.org/2000/svg';
let hideTimer = null, lastEvent = null, waveTimer = null, clockOffset = 0;

// ---------- map setup ----------
const M = window.JMAP, LAND = '#4a5361';
const norm = s => String(s || '').normalize('NFKC').replace(/\s/g, '');
const REG = M.regions.map(r => {
  const el = document.createElementNS(SVGNS, 'path'); el.setAttribute('d', r.d); el.setAttribute('fill', LAND);
  $('regions').appendChild(el); return { ...r, key: norm(r.n), el };
});
const REG_BY_NAME = Object.fromEntries(REG.map(r => [r.key, r]));
$('prefborder').setAttribute('d', M.prefBorder);
const proj = (lon, lat) => [(lon - M.lon0) * M.kx, -(lat - M.lat0) * M.ky];
// '5-' / '5弱' style -> class label; returns highest of the given values
const SHINDO_ALIAS = { '5-': '5弱', '5+': '5強', '6-': '6弱', '6+': '6強' };
function topClass(...vals) {
  let best = -1;
  for (const v of vals) { const s = SHINDO_ALIAS[norm(v)] || norm(v); const i = CLASSES.findIndex(c => c[0] === s); if (i > best) best = i; }
  return best;
}
function classOf(I) { let k = -1; CLASSES.forEach((c, i) => { if (I >= c[1]) k = i; }); return k; }
$('lrow').innerHTML = CLASSES.map(c => `<div class="sw" style="background:${c[2]};color:${c[3]}">${c[0]}</div>`).join('');
function setView(cx, cy, half) {
  const ar = innerWidth / innerHeight, w = half * 2 * ar, h = half * 2;
  // shift so the epicentre sits right of the info panel
  const vb = `${cx - w * 0.6} ${cy - h * 0.5} ${w} ${h}`;
  $('map').setAttribute('viewBox', vb); $('ovl').setAttribute('viewBox', vb);
  const s = h / innerHeight; // km per px
  $('regions').setAttribute('stroke-width', 0.8 * s);
  $('prefborder').setAttribute('stroke-width', 1.6 * s);
  $('official').setAttribute('stroke-width', 5 * s);
  $('pwave').setAttribute('stroke-width', 4 * s);
  $('swave').setAttribute('stroke-width', 5 * s);
  return s;
}
setView(0, 100, 900);

// ---------- simple intensity estimate (Si & Midorikawa 1999 + Midorikawa et al. 1999) ----------
function intensityAt(Mw, depth, R) {
  const X = Math.max(Math.hypot(R, depth) - 0.5 * Math.pow(10, 0.5 * Mw - 1.85), 3);
  const lgPGV600 = 0.58 * Mw + 0.0038 * depth - 1.29 - Math.log10(X + 0.0028 * Math.pow(10, 0.5 * Mw)) - 0.002 * X;
  const pgv = Math.pow(10, lgPGV600) * 1.41;
  return 2.68 + 1.72 * Math.log10(pgv);
}
function radiusFor(Mw, depth, I) {
  if (intensityAt(Mw, depth, 0) < I) return 0;
  let lo = 0, hi = 2000;
  for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; (intensityAt(Mw, depth, mid) >= I) ? lo = mid : hi = mid; }
  return lo;
}

// ---------- standby dashboard ----------
const WEEK = '日月火水木金土';
function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  $('date').textContent = `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`;
  const m = d.getMinutes(); // tiny drift against burn-in
  $('standby').style.transform = `translate(${(m % 5 - 2) * 0.25}vw, ${(Math.floor(m / 5) % 5 - 2) * 0.25}vh)`;
}
setInterval(tick, 10000); tick();
function setFeed(s) {
  $('dot').className = 'dot ' + (s === 'ok' ? 'ok' : s === 'down' ? 'down' : '');
  $('stext').textContent = s === 'ok' ? '緊急地震速報 待機中（直接受信）' : s === 'down' ? '受信サーバーに再接続中…' : '接続中…';
}
// static land drawn once, shared by main map and inset
$('landpath').setAttribute('d', M.regions.map(r => r.d).join(''));
$('landpref').setAttribute('d', M.prefBorder);
$('smap').setAttribute('viewBox', '-880 -1050 1900 1720');
$('inset').setAttribute('viewBox', '-1330 650 720 720');
['landpath', 'landpref'].forEach(id => $(id).setAttribute('stroke-width', 2.2));
$('slegend').innerHTML = '最大震度 ' + CLASSES.map(c => `<span class="badge" style="background:${c[2]};color:${c[3]}">${c[0]}</span>`).join('');
const badgeStyle = sh => { const i = topClass(sh); const c = CLASSES[i]; return c ? `background:${c[2]};color:${c[3]}` : 'background:#e6ebf0;color:#6b7684'; };
const shLabel = sh => { const i = topClass(sh); return i < 0 ? '-' : CLASSES[i][0]; };
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? 'たった今' : m < 60 ? `${m}分前` : m < 1440 ? `${Math.floor(m / 60)}時間前` : `${Math.floor(m / 1440)}日前`;
}
let EQ = [], eqMd5 = '';
function drawQuakes() {
  if (!EQ.length) return;
  const now = Date.now(), L = EQ[0];
  $('lbadge').style.cssText = badgeStyle(L.shindo); $('lbadge').textContent = shLabel(L.shindo);
  $('lplace').textContent = L.location;
  $('lmeta').textContent = `${L.time.slice(11)}（${ago(L.t)}） M${L.magnitude} ・ 深さ${L.depth}`;
  $('linfo').textContent = L.info || '';
  const d1 = EQ.filter(e => now - e.t < 864e5), d7 = EQ.filter(e => now - e.t < 7 * 864e5);
  $('s24').innerHTML = `${d1.length}<small>回</small>`; $('s7').innerHTML = `${d7.length}<small>回</small>`;
  const top = d7.reduce((a, e) => topClass(e.shindo) > topClass(a ? a.shindo : '') ? e : a, null);
  $('smax').innerHTML = top ? `<span class="badge" style="${badgeStyle(top.shindo)};padding:0 .6vw;font-size:1.8vw">${shLabel(top.shindo)}</span>` : '-';
  $('eqrows').innerHTML = EQ.slice(0, 14).map(e => `<div class="eq"><span class="t">${e.time.slice(5)}</span>` +
    `<span class="badge" style="${badgeStyle(e.shindo)}">${shLabel(e.shindo)}</span><span class="pl">${e.location}</span><span class="m">M${e.magnitude}</span></div>`).join('');
  // epicentres: newest drawn last (on top); older ones fade
  const span = now - EQ[EQ.length - 1].t || 1;
  const dots = EQ.slice().reverse().map((e, k, arr) => {
    const [x, y] = proj(+e.longitude, +e.latitude); if (!isFinite(x)) return '';
    const i = topClass(e.shindo), c = CLASSES[i] || CLASSES[0];
    const r = 6 + Math.max(0, +e.magnitude || 0) ** 1.6 * 2.2, op = 0.35 + 0.65 * (1 - (now - e.t) / span);
    const newest = k === arr.length - 1;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c[2]}" fill-opacity="${op.toFixed(2)}" stroke="#3a4552" stroke-opacity=".55" stroke-width="2.5"/>` +
      (newest ? `<circle cx="${x}" cy="${y}" r="${r + 16}" fill="none" stroke="#d81b60" stroke-width="5"/>` +
        `<text x="${x + r + 26}" y="${y + 12}" fill="#d81b60" font-size="40" font-weight="800" paint-order="stroke" stroke="#fff" stroke-width="10">最新</text>` : '');
  }).join('');
  $('dots').innerHTML = dots; $('dots2').innerHTML = dots;
  $('mapsub').textContent = `直近${EQ.length}件 ・ ${new Date(EQ[EQ.length - 1].t).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })}〜`;
}
function pollEq() {
  fetch('https://api.wolfx.jp/jma_eqlist.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(d => {
    if (d.md5 && d.md5 === eqMd5) return drawQuakes();
    eqMd5 = d.md5 || '';
    EQ = Object.keys(d).filter(k => /^No\d+$/.test(k)).sort((a, b) => a.slice(2) - b.slice(2)).map(k => d[k])
      .map(e => ({ ...e, t: jst(e.time_full || e.time + ':00') })).filter(e => e.t);
    drawQuakes();
  }).catch(() => {});
}

// ---------- weather (Open-Meteo, no key) — rotates with the quake map ----------

setInterval(() => { if (ws && ws.readyState === 1 && Date.now() - lastMsg > 150000) { try { ws.close(); } catch (err) {} } }, 10000);
connectFeed();

function fmtJST(ms) { return new Date(ms + 9 * 3600e3).toISOString().slice(0, 19).replace('T', ' ').replace(/-/g, '/'); }
function runDemo(name) {
  const d = DEMOS[name]; if (!d) return;
  const origin = Date.now() - d.reports[0][0] * 1000 + 6000, id = 'DEMO' + Date.now();
  let lastAreas = [];
  d.reports.forEach(([t, lat, lon, depth, M, mi, areas], i) => setTimeout(() => {
    if (areas.length) lastAreas = areas;
    const warn = i >= d.warnFrom;
    const e = { type: 'jma_eew', Title: warn ? '緊急地震速報（警報）' : '緊急地震速報（予報）', EventID: id, Serial: i + 1,
      AnnouncedTime: fmtJST(Date.now()), OriginTime: fmtJST(origin), Hypocenter: d.hypo, Latitude: lat, Longitude: lon,
      Magunitude: M, Depth: depth, MaxIntensity: mi, isWarn: warn, isFinal: i === d.reports.length - 1, isCancel: false,
      isSea: /沖|灘|近海|湾/.test(d.hypo), WarnArea: lastAreas.map(a => ({ Chiiki: a[0], Shindo1: a[1], Shindo2: a[2] })), _recv: Date.now() / 1000 };
    e[d.flag] = true; show(e);
  }, 6000 + (t - d.reports[0][0]) * 1000));
}
const demo = new URLSearchParams(location.search).get('demo'); if (demo) runDemo(demo);

// ---------- remote drill: an open page picks up test.json (no reload, so no CEC wake-up) ----------
// test.json = {"id": "...", "demo": "drill" | "replay", "at": <epoch seconds>}; runs once per id, only if fresh
let testSeen = null;
function pollTest() {
  fetch('test.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(t => {
    if (!t || !t.id) return;
    if (testSeen === null) { testSeen = t.id; return; }            // ignore whatever was there at load time
    if (t.id !== testSeen && Math.abs(Date.now() / 1000 - (t.at || 0)) < 600) { testSeen = t.id; histAdd('テスト指示を受信 → 6秒後に開始'); runDemo(t.demo || 'drill'); }
  }).catch(() => {});
}
pollTest(); setInterval(pollTest, 15000);
